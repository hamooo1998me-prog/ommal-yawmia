<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111">
<title>عمال يوميه</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0d0e10;--p:#191b20;--p2:#24262c;--g:#d8ad52;--gt:#f0d38a;--t:#f5f5f5;--m:#a8adb5;--l:#30333a;--gr:#59c58a;--r:#f08080}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.7 Tahoma,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hide{display:none!important}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;padding:11px;background:#101114;color:var(--t);border:1px solid var(--l);border-radius:10px}
textarea{resize:vertical;min-height:75px}
label{display:block;font-size:13px;margin-bottom:5px;color:#d5d7dc}
.field{margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.span2{grid-column:1/-1}
.btn{background:var(--g);color:#17130a;border:0;border-radius:10px;padding:10px 14px;font-weight:bold}
.btn.alt{background:var(--p2);color:var(--t);border:1px solid var(--l)}
.btn.danger{background:#512626;color:#fff}
.btn.sm{padding:6px 10px;font-size:12px}
.panel{background:var(--p);border:1px solid var(--l);border-radius:15px;padding:16px;margin-bottom:15px}
.status{font-size:13px;min-height:20px;margin-top:8px;color:var(--m);overflow-wrap:anywhere}
.error{color:var(--r)}
.green{color:var(--gr)}
.gold{color:var(--gt)}
.muted{color:var(--m)}
.loginwrap{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(ellipse at top,#302718,transparent 55%),var(--bg)}
.login{width:min(100%,420px);padding:24px;background:var(--p);border:1px solid #5a4928;border-radius:20px}
.logo{margin:auto auto 12px;width:54px;height:54px;display:grid;place-items:center;background:var(--g);color:#111;border-radius:15px;font-size:28px;font-weight:bold}
.center{text-align:center}
.top{height:64px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:0 15px;background:#111216f5;border-bottom:1px solid var(--l)}
.brand{display:flex;gap:10px;align-items:center;font-weight:bold}
.brand i{font-style:normal;background:var(--g);color:#111;padding:5px 11px;border-radius:10px}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 64px)}
aside{padding:14px 10px;background:#111216;border-left:1px solid var(--l)}
.nav{display:block;width:100%;text-align:right;color:#c8cbd1;background:transparent;border:0;padding:11px;border-radius:10px;margin-bottom:4px}
.nav.active,.nav:hover{background:#2a251b;color:var(--gt)}
.navtitle{font-size:11px;color:#777;padding:8px}
main{padding:22px;max-width:1400px;width:100%;margin:auto}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.head h1{font-size:24px;margin:0}
.head p{margin:0;color:var(--m);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin-bottom:16px}
.stat{background:linear-gradient(145deg,#1d1f24,#141518);border:1px solid var(--l);border-radius:14px;padding:14px;min-width:0}
.stat small{display:block;color:var(--m)}
.stat strong{display:block;font-size:21px;overflow-wrap:anywhere}
.shorts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.short{background:var(--p2);color:var(--t);border:1px solid var(--l);border-radius:13px;padding:13px 7px}
.short b,.short small{display:block}
.short span{font-size:23px}
.short small{color:var(--m)}
.filters{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.filters .field{flex:1;min-width:150px}
.tablewrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:600px}
td,th{text-align:right;padding:10px 8px;border-bottom:1px solid var(--l);vertical-align:middle}
th{color:var(--m);font-size:12px;font-weight:normal}
td{font-size:13px}
.empty{text-align:center;padding:25px;color:var(--m)}
.details{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.detail{background:#111216;border:1px solid var(--l);border-radius:10px;padding:12px;overflow-wrap:anywhere}
.detail b{display:block;font-size:18px}
.menu{display:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rule{border:0;border-top:1px solid var(--l);margin:18px 0}
.notice{background:#2b261b;border:1px solid #5a4928;color:var(--gt);padding:11px;border-radius:10px;margin:12px 0}
.tag{display:inline-block;padding:3px 8px;border-radius:8px;background:#29251d;color:var(--gt);font-size:12px}
@media(max-width:850px){
.layout{display:block}
aside{position:fixed;z-index:9;top:64px;bottom:0;right:0;width:245px;overflow:auto;transform:translateX(110%);transition:.2s;box-shadow:-10px 0 25px #0008}
aside.open{transform:translateX(0)}
.menu{display:inline-block}
.cards,.shorts{grid-template-columns:repeat(2,minmax(0,1fr))}
main{padding:14px}
}
@media(max-width:520px){
.grid{grid-template-columns:1fr}
.span2{grid-column:auto}
.head{align-items:flex-start;flex-direction:column}
.panel{padding:12px}
.stat{padding:11px}
.stat strong{font-size:18px}
.details{grid-template-columns:1fr 1fr}
.useremail{display:none}
}
@media print{
body{background:white;color:black}
.top,aside,.noprint,.shorts{display:none!important}
.layout{display:block}
main{padding:0;max-width:none}
.panel,.stat,.detail{background:white;color:black;border:1px solid #aaa}
.cards{grid-template-columns:repeat(4,1fr)}
td,th{color:black;white-space:normal;border-color:#aaa}
table{min-width:0}
}
</style>
</head>
<body>

<section id="loginScreen" class="loginwrap">
<form id="loginForm" class="login">
<div class="logo">ع</div>
<h1 class="center">عمال يوميه</h1>
<p class="center muted">إدارة العمال وأيام العمل والمدفوعات</p>
<div class="field">
<label>البريد الإلكتروني</label>
<input id="email" type="email" required autocomplete="username">
</div>
<div class="field">
<label>كلمة المرور</label>
<input id="password" type="password" required autocomplete="current-password">
</div>
<button class="btn" id="loginBtn" style="width:100%">تسجيل الدخول</button>
<div id="loginStatus" class="status"></div>
</form>
</section>

<div id="app" class="hide">
<header class="top">
<div class="brand">
<button class="btn alt sm menu" id="menuBtn">☰</button>
<i>ع</i> عمال يوميه
</div>
<div class="row">
<span id="userEmail" class="muted useremail"></span>
<button id="refresh" class="btn alt sm">↻ تحديث</button>
</div>
</header>
<div class="layout">
<aside id="sidebar">
<div class="navtitle">القائمة الرئيسية</div>
<button class="nav active" data-page="home">⌂　الرئيسية</button>
<button class="nav" data-page="workers">♙　العمال</button>
<button class="nav" data-page="newWorker">＋　تسجيل عامل جديد</button>
<button class="nav" data-page="workdays">▦　أيام العمل</button>
<button class="nav" data-page="payments">⇄　المدفوعات</button>
<button class="nav" data-page="reports">▤　التقارير وكشوف الحساب</button>
<button class="nav" data-page="about">ⓘ　نبذة عن التطبيق</button>
<hr class="rule">
<button class="nav" id="switch">⇆　تبديل الحساب</button>
<button class="nav" id="logout">↪　تسجيل الخروج</button>
</aside>
<main id="main"><div class="empty">جارٍ التحميل...</div></main>
</div>
</div>

<script>
"use strict";

/* إعدادات المشروع الحالي */
const SUPABASE_URL = "https://qawnvmuwbcsfldcjikhb.supabase.co";
const SUPABASE_KEY = "sb_publishable_nTHygssJpBnfaHocmO2ONQ_SQQutIg7";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
const money = n => (Number(n)||0).toLocaleString("ar-SA",{minimumFractionDigits:2,maximumFractionDigits:2})+" ر.س";
const num = v => Math.max(0,Number(v)||0);
const today = () => new Date().toLocaleDateString("en-CA");
const esc = v => String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const val = id => $(id)?.value?.trim() ?? "";
const setStatus = (id,msg,error=false) => {if($(id)){$(id).textContent=msg;$(id).className="status"+(error?" error":"");}};
let user=null, workers=[], days=[], payments=[], page="home", selectedWorker=null;

function pageHead(title,sub=""){
return `<div class="head"><div><h1>${esc(title)}</h1><p>${esc(sub)}</p></div></div>`;
}
function stat(title,value,icon=""){
return `<div class="stat"><small>${icon} ${esc(title)}</small><strong>${value}</strong></div>`;
}
function panel(title,body,extra=""){
return `<section class="panel"><h2>${title}</h2>${extra}${body}</section>`;
}
function field(label,id,type="text",required=false,placeholder="",value=""){
return `<div class="field"><label for="${id}">${esc(label)}${required?" *":""}</label><input id="${id}" type="${type}" ${required?"required":""} placeholder="${esc(placeholder)}" value="${esc(value)}"></div>`;
}
function selectWorker(id="workerSelect",chosen=""){
return `<div class="field"><label for="${id}">العامل *</label><select id="${id}" required><option value="">اختر العامل</option>${workers.map(w=>`<option value="${w.id}" ${String(chosen)===String(w.id)?"selected":""}>${esc(w.name)}${w.work_location?" — "+esc(w.work_location):""}</option>`).join("")}</select></div>`;
}
function calcTotal(){
const d=num(val("daysCount")),rate=num(val("dailyRate")),oh=num(val("overtimeHours")),orate=num(val("overtimeRate"));
if($("liveTotal"))$("liveTotal").textContent=money(d*rate+oh*orate);
}
function calcPayment(){
const id=val("payWorker"),amount=num(val("payAmount")),w=workers.find(x=>String(x.id)===String(id));
if($("payBalance"))$("payBalance").textContent=w?money(workerDue(w.id)-workerPaid(w.id)-amount):"—";
}
function workerDue(id){
return days.filter(d=>String(d.worker_id)===String(id)).reduce((s,d)=>s+Number(d.total_due||Number(d.days_count||0)*Number(d.daily_rate||0)+Number(d.overtime_hours||0)*Number(d.overtime_hourly_rate||0)),0);
}
function workerPaid(id){
return payments.filter(p=>String(p.worker_id)===String(id)).reduce((s,p)=>s+Number(p.amount||0),0);
}
function totalDue(){return days.reduce((s,d)=>s+Number(d.total_due||Number(d.days_count||0)*Number(d.daily_rate||0)+Number(d.overtime_hours||0)*Number(d.overtime_hourly_rate||0)),0)}
function totalPaid(){return payments.reduce((s,p)=>s+Number(p.amount||0),0)}
function balance(id){return workerDue(id)-workerPaid(id)}

async function loadData(){
if(!user)return;
$("main").innerHTML='<div class="empty">جارٍ تحميل البيانات...</div>';
try{
const [wr,dr,pr]=await Promise.all([
db.from("workers").select("*").order("id",{ascending:false}),
db.from("work_days").select("*").order("work_date",{ascending:false}),
db.from("worker_payments").select("*").order("payment_date",{ascending:false})
]);
if(wr.error)throw wr.error;
if(dr.error)throw dr.error;
if(pr.error)throw pr.error;
workers=wr.data||[];days=dr.data||[];payments=pr.data||[];
render();
}catch(e){
$("main").innerHTML=panel("تعذر تحميل البيانات",`<p class="error">${esc(e.message||"حدث خطأ غير معروف")}</p><button class="btn" onclick="loadData()">إعادة المحاولة</button><p class="muted">تأكد من تسجيل الدخول وصلاحيات قاعدة البيانات والجداول الموجودة.</p>`);
}
}
function go(p){
page=p;
document.querySelectorAll(".nav[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));
$("sidebar").classList.remove("open");
render();
}
function render(){
if(!user)return;
if(page==="home")renderHome();
else if(page==="workers")renderWorkers();
else if(page==="newWorker")renderNewWorker();
else if(page==="workdays")renderWorkdays();
else if(page==="payments")renderPayments();
else if(page==="reports")renderReports();
else if(page==="detail")renderDetail();
else if(page==="about")renderAbout();
}
function renderHome(){
$("main").innerHTML=pageHead("الرئيسية","ملخص حسابات العمال وأيام العمل والمدفوعات")+
`<div class="cards">
${stat("عدد العمال",workers.length,"♙")}
${stat("إجمالي المستحقات",money(totalDue()),"◈")}
${stat("إجمالي المدفوع",money(totalPaid()),"⇄")}
${stat("المتبقي",money(totalDue()-totalPaid()),"◉")}
</div>
<div class="panel"><h2>اختصارات سريعة</h2><div class="shorts">
<button class="short" onclick="go('newWorker')"><span>＋</span><b>تسجيل عامل</b><small>إضافة عامل جديد</small></button>
<button class="short" onclick="go('workers')"><span>♙</span><b>قائمة العمال</b><small>عرض ملفات العمال</small></button>
<button class="short" onclick="go('payments')"><span>⇄</span><b>تسجيل دفعة</b><small>إضافة مبلغ مدفوع</small></button>
<button class="short" onclick="go('reports')"><span>▤</span><b>التقارير</b><small>كشف حساب وطباعة</small></button>
</div></div>`+
panel("آخر العمال",workers.length?`<div class="tablewrap"><table><thead><tr><th>الاسم</th><th>الموقع</th><th>المستحق</th><th>المدفوع</th><th>المتبقي</th><th></th></tr></thead><tbody>${workers.slice(0,8).map(w=>workerRow(w)).join("")}</tbody></table></div>`:'<div class="empty">لا يوجد عمال حتى الآن.</div>');
}
function workerRow(w){
return `<tr><td>${esc(w.name)}</td><td>${esc(w.work_location||"—")}</td><td>${money(workerDue(w.id))}</td><td>${money(workerPaid(w.id))}</td><td class="${balance(w.id)<0?"error":"green"}">${money(balance(w.id))}</td><td><button class="btn alt sm" onclick="openWorker('${w.id}')">فتح الملف</button></td></tr>`;
}
function renderWorkers(){
$("main").innerHTML=pageHead("العمال","بحث وعرض أرصدة العمال")+
panel("قائمة العمال",`<div class="field"><label>بحث بالاسم أو الموقع</label><input id="workerSearch" placeholder="اكتب اسم العامل أو الموقع..."></div>
<div id="workersTable"></div>`);
const draw=()=>{
const q=val("workerSearch").toLowerCase();
const list=workers.filter(w=>(w.name||"").toLowerCase().includes(q)||(w.work_location||"").toLowerCase().includes(q));
$("workersTable").innerHTML=list.length?`<div class="tablewrap"><table><thead><tr><th>الاسم</th><th>الموقع</th><th>المستحق</th><th>المدفوع</th><th>المتبقي</th><th>الملف</th></tr></thead><tbody>${list.map(workerRow).join("")}</tbody></table></div>`:'<div class="empty">لا توجد نتائج.</div>';
};
$("workerSearch").addEventListener("input",draw);draw();
}
function renderNewWorker(){
$("main").innerHTML=pageHead("تسجيل عامل جديد","بيانات العامل وأول يوم عمل ودفعة اختيارية")+
`<form id="newWorkerForm">
${panel("بيانات العامل",`<div class="grid">
${field("اسم العامل","newName","text",true,"اسم العامل")}
${field("الموقع أو الفرع","newLocation","text",false,"مكان العمل")}
${field("تاريخ التسجيل / أول يوم عمل","newDate","date",false,"",today())}
<div class="field span2"><label>ملاحظات العامل</label><textarea id="newNotes" placeholder="ملاحظات اختيارية"></textarea></div>
</div>`)}
${panel("أول يوم عمل (اختياري)",`<div class="grid">
${field("عدد الأيام","daysCount","number",false,"مثال: 1")}
${field("أجرة اليوم","dailyRate","number",false,"المبلغ بالريال")}
${field("ساعات إضافية","overtimeHours","number",false,"0")}
${field("سعر الساعة الإضافية","overtimeRate","number",false,"0")}
<div class="span2 detail"><small class="muted">إجمالي أول يوم عمل</small><b id="liveTotal">0.00 ر.س</b></div>
<div class="field span2"><label>ملاحظات يوم العمل</label><textarea id="dayNotes"></textarea></div>
</div>`)}
${panel("دفعة أولى (اختياري)",`<div class="grid">
${field("المبلغ المدفوع","initialPayment","number",false,"المبلغ بالريال")}
${field("تاريخ الدفع","initialPaymentDate","date",false,"",today())}
<div class="field span2"><label>ملاحظات الدفع</label><textarea id="initialPaymentNotes"></textarea></div>
</div>`)}
<div class="row"><button class="btn" id="saveNewWorker">حفظ العامل</button><button type="button" class="btn alt" onclick="go('workers')">إلغاء</button></div>
<div id="newWorkerStatus" class="status"></div>
</form>`;
["daysCount","dailyRate","overtimeHours","overtimeRate"].forEach(id=>$(id).addEventListener("input",calcTotal));
$("newWorkerForm").addEventListener("submit",saveNewWorker);
}
async function saveNewWorker(e){
e.preventDefault();
const btn=$("saveNewWorker");btn.disabled=true;
setStatus("newWorkerStatus","جارٍ حفظ البيانات...");
try{
const name=val("newName");
if(!name)throw Error("اكتب اسم العامل.");
const d=num(val("daysCount")),rate=num(val("dailyRate")),oh=num(val("overtimeHours")),orate=num(val("overtimeRate"));
const hasDay=val("daysCount")!==""||val("dailyRate")!==""||val("overtimeHours")!==""||val("overtimeRate")!=="";
const initial=num(val("initialPayment"));
const workerData={name,work_location:val("newLocation")||null,notes:val("newNotes")||null,created_by:user.id};
const {data:w,error}=await db.from("workers").insert(workerData).select().single();
if(error)throw error;
let partial=[];
if(hasDay){
const {error:de}=await db.from("work_days").insert({
worker_id:w.id,created_by:user.id,work_date:val("newDate")||today(),
work_location:val("newLocation")||null,days_count:d,daily_rate:rate,
overtime_hours:oh,overtime_hourly_rate:orate,notes:val("dayNotes")||null
});
if(de)partial.push("تعذر حفظ أول يوم عمل: "+de.message);
}
if(initial>0){
const {error:pe}=await db.from("worker_payments").insert({
worker_id:w.id,created_by:user.id,payment_date:val("initialPaymentDate")||today(),
amount:initial,notes:val("initialPaymentNotes")||null
});
if(pe)partial.push("تعذر حفظ الدفعة الأولى: "+pe.message);
}
await loadData();
if(partial.length){alert("تم تسجيل العامل، لكن توجد مشكلة:\n"+partial.join("\n"));openWorker(w.id);}
else{alert("تم حفظ العامل بنجاح.");openWorker(w.id);}
}catch(err){setStatus("newWorkerStatus",err.message||"تعذر حفظ البيانات",true);}
finally{btn.disabled=false;}
}
function openWorker(id){selectedWorker=String(id);page="detail";render();}
function renderDetail(){
const w=workers.find(x=>String(x.id)===String(selectedWorker));
if(!w){$("main").innerHTML=pageHead("ملف العامل")+`<div class="empty">العامل غير موجود.</div><button class="btn" onclick="go('workers')">العودة للعمال</button>`;return;}
const wd=days.filter(d=>String(d.worker_id)===String(w.id));
const wp=payments.filter(p=>String(p.worker_id)===String(w.id));
$("main").innerHTML=pageHead("ملف العامل","بيانات العمل والحسابات المسجلة")+
`<div class="row noprint" style="margin-bottom:15px">
<button class="btn alt" onclick="go('workers')">← قائمة العمال</button>
<button class="btn" onclick="go('workdays');setTimeout(()=>{if($('workerSelect'))$('workerSelect').value='${w.id}'},0)">＋ إضافة يوم عمل</button>
<button class="btn" onclick="go('payments');setTimeout(()=>{if($('payWorker')){$('payWorker').value='${w.id}';calcPayment()}},0)">＋ تسجيل دفعة</button>
<button class="btn alt" onclick="window.print()">طباعة الكشف</button>
</div>
${panel("بيانات العامل",`<div class="details">
<div class="detail"><small class="muted">الاسم</small><b>${esc(w.name)}</b></div>
<div class="detail"><small class="muted">الموقع</small><b>${esc(w.work_location||"—")}</b></div>
<div class="detail"><small class="muted">تاريخ التسجيل</small><b>${esc(w.work_date||"—")}</b></div>
</div><p>${esc(w.notes||"لا توجد ملاحظات")}</p>`)}
<div class="cards">
${stat("إجمالي المستحق",money(workerDue(w.id)))}
${stat("إجمالي المدفوع",money(workerPaid(w.id)))}
${stat("المتبقي",money(balance(w.id)))}
${stat("عدد أيام/سجلات العمل",wd.length)}
</div>

async function saveDay(e){
e.preventDefault();const btn=$("saveDay");btn.disabled=true;
setStatus("dayStatus","جارٍ الحفظ...");
try{
const worker_id=val("workerSelect"),work_date=val("workDate");
if(!worker_id)throw Error("اختر العامل.");
const d=num(val("daysCount")),r=num(val("dailyRate")),oh=num(val("overtimeHours")),orr=num(val("overtimeRate"));
if(d<=0)throw Error("عدد الأيام يجب أن يكون أكبر من صفر.");
if(!work_date)throw Error("اختر تاريخ العمل.");
const {error}=await db.from("work_days").insert({
worker_id,created_by:user.id,work_date,work_location:val("workLocation")||null,
days_count:d,daily_rate:r,overtime_hours:oh,overtime_hourly_rate:orr,notes:val("workNotes")||null
});
if(error)throw error;
alert("تم حفظ يوم العمل.");
await loadData();go("workdays");
}catch(err){setStatus("dayStatus",err.message||"تعذر الحفظ",true);}
finally{btn.disabled=false;}
}

function showReport(){
const wid=val("reportWorker"),from=val("reportFrom"),to=val("reportTo");
let ds=days.filter(d=>(!wid||String(d.worker_id)===wid)&&(!from||d.work_date>=from)&&(!to||d.work_date<=to));
let ps=payments.filter(p=>(!wid||String(p.worker_id)===wid)&&(!from||p.payment_date>=from)&&(!to||p.payment_date<=to));
const due=ds.reduce((s,d)=>s+Number(d.total_due??num(d.days_count)*num(d.daily_rate)+num(d.overtime_hours)*num(d.overtime_hourly_rate)),0);
const paid=ps.reduce((s,p)=>s+Number(p.amount||0),0);
let html=`<div class="cards">${stat("مستحقات الفترة",money(due))}${stat("مدفوعات الفترة",money(paid))}${stat("الفرق",money(due-paid))}${stat("سجلات العمل",ds.length)}</div>`;
html+=panel("تفاصيل أيام العمل",ds.length?`<div class="tablewrap"><table><thead><tr><th>التاريخ</th><th>العامل</th><th>الموقع</th><th>الأيام</th><th>أجرة اليوم</th><th>إضافي</th><th>الإجمالي</th></tr></thead><tbody>${ds.map(d=>`<tr><td>${esc(d.work_date)}</td><td>${esc(workers.find(w=>String(w.id)===String(d.worker_id))?.name||"—")}</td><td>${esc(d.work_location||"—")}</td><td>${esc(d.days_count)}</td><td>${money(d.daily_rate)}</td><td>${esc(d.overtime_hours||0)} × ${money(d.overtime_hourly_rate||0)}</td><td>${money(d.total_due??num(d.days_count)*num(d.daily_rate)+num(d.overtime_hours)*num(d.overtime_hourly_rate))}</td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">لا توجد سجلات عمل في الفترة المحددة.</div>');
html+=panel("تفاصيل المدفوعات",ps.length?`<div class="tablewrap"><table><thead><tr><th>التاريخ</th><th>العامل</th><th>المبلغ</th><th>ملاحظات</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${esc(p.payment_date)}</td><td>${esc(workers.find(w=>String(w.id)===String(p.worker_id))?.name||"—")}</td><td>${money(p.amount)}</td><td>${esc(p.notes||"—")}</td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">لا توجد مدفوعات في الفترة المحددة.</div>');
$("reportResult").innerHTML=html;
}

async function showApp(){
const {data:{session},error}=await db.auth.getSession();
if(error)console.error(error);
if(!session){user=null;$("app").classList.add("hide");$("loginScreen").classList.remove("hide");return;}
user=session.user;
$("loginScreen").classList.add("hide");$("app").classList.remove("hide");
$("userEmail").textContent=user.email||"";
await loadData();
}
$("loginForm").addEventListener("submit",async e=>{
e.preventDefault();
const btn=$("loginBtn");btn.disabled=true;
setStatus("loginStatus","جارٍ تسجيل الدخول...");
try{
const {data,error}=await db.auth.signInWithPassword({email:val("email"),password:val("password")});
if(error)throw error;
user=data.user;await showApp();
}catch(err){setStatus("loginStatus",err.message||"تعذر تسجيل الدخول",true);}
finally{btn.disabled=false;}
});
$("logout").addEventListener("click",async()=>{
if(!confirm("هل تريد تسجيل الخروج؟"))return;
await db.auth.signOut();user=null;workers=[];days=[];payments=[];
$("app").classList.add("hide");$("loginScreen").classList.remove("hide");setStatus("loginStatus","");
});
$("switch").addEventListener("click",async()=>{
await db.auth.signOut();user=null;
$("app").classList.add("hide");$("loginScreen").classList.remove("hide");
$("email").value="";$("password").value="";setStatus("loginStatus","سجل الدخول بالحساب الآخر.");
});
$("refresh").addEventListener("click",loadData);
$("menuBtn").addEventListener("click",()=>$("sidebar").classList.toggle("open"));
document.querySelectorAll(".nav[data-page]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
db.auth.onAuthStateChange((_event,session)=>{
if(!session){user=null;$("app").classList.add("hide");$("loginScreen").classList.remove("hide");}
});
showApp();
</script>
